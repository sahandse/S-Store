name: Build S Store Package
on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/s-store/**'
      - '.github/workflows/build-s-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        run: |
          mkdir -p dist/s-store
          cp -R plugins/s-store/. dist/s-store/
          cd dist
          zip -r ../s-store-2.7.0.zip s-store
      - uses: actions/upload-artifact@v4
        with:
          name: s-store-2.7.0
          path: s-store-2.7.0.zip
          if-no-files-found: error
